<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Catalogo real | SKANO STORE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080e1b;color:#f4f7ff;font-family:Arial,sans-serif}
header{padding:24px 5%;background:#14213a;border-bottom:2px solid #1774ff}
header h1{margin:0}
header p{color:#bac9de}
main{max-width:1150px;margin:auto;padding:30px 18px}
a{color:#88b7ff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.producto{background:#14213a;border:1px solid #35445d;border-radius:14px;overflow:hidden}
.foto{width:100%;height:215px;object-fit:contain;background:white}
.info{padding:17px}
.info h2{font-size:18px;line-height:1.3}
.precio{font-size:24px;font-weight:bold;color:#65a6ff}
.estado{padding:15px;background:#15233b;border-radius:10px;margin-bottom:24px}
.pendiente{color:#c2cde0}
button{background:#37445a;color:#dae2f0;border:0;border-radius:8px;padding:12px}
</style>
</head>
<body>
<header>
  <h1>SKANO STORE</h1>
  <p>Accesorios de seguridad seleccionados por SKANO</p>
</header>
<main>
  <p><a href="./index.html">Volver a la tienda demostrativa</a></p>
  <h1>Catalogo de productos reales</h1>
  <p id="estado" class="estado" role="status">Consultando Firebase...</p>
  <div id="catalogo" class="grid"></div>
  <p class="pendiente">
    Catalogo en preparacion. Las compras en linea aun no estan habilitadas.
  </p>
</main>
<script type="module" src="./js/catalogo-real.js"></script>
</body>
</html>
